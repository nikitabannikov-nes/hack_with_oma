<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Товар — ОМА Проект</title><link rel="stylesheet" href="style.css?v=202610280100"><link rel="stylesheet" href="app.css?v=202610280100"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="oma-skin.css?v=202610280100">
<style>.pg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 340px;gap:24px;margin-top:6px;align-items:start}.spec{display:grid;gap:2px;font-size:14px;margin-top:14px}.spec div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed var(--line);padding:7px 0}.spec span{color:var(--mute)}.buy{padding:22px}.price{font-size:32px;font-weight:800}.inst{background:#fff1de;border:2px dashed var(--orange);border-radius:12px;padding:12px;margin-top:12px}.calcbox{background:var(--blue-l);border-radius:12px;padding:14px;margin-top:12px}@media(max-width:1000px){.pg{grid-template-columns:1fr}.pimg.big{height:260px}}</style></head><body><div id="chrome"></div>
<div class="wrap" id="app"></div>
<div class="modal-bg" id="mCalc" onclick="if(event.target===this)this.classList.remove('show')"><div class="modal">
 <button class="x" onclick="$('#mCalc').classList.remove('show')">×</button>
 <h2 style="margin:0 0 6px">Рассчитать количество</h2><p class="note" style="margin:0 0 14px" id="mcSub"></p>
 <div id="mcRole"></div><div id="mcProj" class="mt2"></div>
 <button class="btn o wide mt2" onclick="startCalc()">Перейти к плану помещения →</button>
</div></div>
<script src="oma-catalog.js?v=202610280100"></script><script src="oma-menu.js?v=202610280100"></script><script src="oma-social.js?v=202610280100"></script><script src="data.js?v=202610280100"></script><script src="geom.js?v=202610280100"></script><script src="calc.js?v=202610280100"></script><script src="core.js?v=202610280100"></script><script src="plan.js?v=202610280100"></script><script src="omik.js?v=202610280100"></script><script>
const pr=P(qp('id'))||P('tw_opt');
window.OMIK_CTX={page:'product',productId:pr.id};
chrome('catalog');
document.title=pr.name+' — ОМА Проект';
let qty=1,roleSel=pr.roles.includes('tileFloor')&&pr.roles.includes('tileWall')?'both':pr.roles[0],target='new';
function draw(){
 const ap=activeProject(),inEst=ap&&ap.est.lines.find(l=>l.pid===pr.id),A=analogs(pr.id).slice(0,4),rel=(pr.rel||[]).map(P).filter(Boolean).slice(0,4),sv=pr.service&&svc(pr.service);
 $('#app').innerHTML=`<div class="crumbs"><a href="index.html">Главная</a> / <a href="catalog.html">Каталог</a> / <a href="catalog.html?cat=${pr.cat}">${CATS[pr.cat].name}</a> / ${esc(pr.name)}</div>
 <div class="pg"><div>${pimg(pr,'big')}</div>
  <div>${badges(pr)}${pr.real?`<span class="tag demo">Код: ${esc(pr.sku)}${pr.brand?' · '+esc(pr.brand):''}</span>${pr.rating?` <span class="tag">★ ${pr.rating.toFixed(1)}</span>`:''}`:`<span class="tag demo">Арт. ${pr.id.toUpperCase()} · демо</span>`}<h1 style="font-size:24px;margin-top:10px">${esc(pr.name)}</h1>
   <p style="margin:0 0 6px">${esc(pr.desc||'')}</p>
   <div class="spec">${(pr.props||[]).map(([k,v])=>`<div><span>${k}</span><b>${esc(v)}</b></div>`).join('')}${pr.pack?`<div><span>Единица продажи</span><b>${pr.unit} (${num(pr.pack.q)} ${pr.pack.u})</b></div>`:''}</div>
   ${pr.roles.length?`<div class="tip mt2" style="margin-bottom:0"><img src="img/omik-idea.png" alt=""><div>Расход считается по характеристикам этого товара${pr.spec.rate?` (${num(pr.spec.rate)} ${pr.cat==='mix'&&pr.roles[0]==='glue'?'кг/м² на 1 мм':pr.roles[0]==='primer'?'л/м²':'кг/м²'})`:pr.spec.cover?` (${pr.spec.cover} м²/л на слой)`:pr.spec.size?` (формат ${pr.spec.size.join('×')}, ${pr.pack.q} м² в упаковке)`:''} и площадям вашего плана.</div></div>`:''}
  </div>
  <div class="card buy"><div class="price">${byn(pr.price)}${pr.oldPrice?` <s style="font-size:16px;color:var(--mute)">${byn(pr.oldPrice)}</s>`:''}</div><div class="note">за ${pr.unit}${pr.priceM2?` · ${byn(pr.priceM2)} за м²`:''}</div>
   <div class="note" style="color:var(--ok);font-weight:600;margin:8px 0 14px">● ${pr.real?`Цена с oma.by · <a href="${pr.url}" target="_blank" rel="noopener" style="color:var(--blue)">карточка на сайте ОМА ↗</a>`:'Наличие в демо не проверяется'}</div>
   <div style="display:flex;gap:8px;align-items:center"><span class="qty"><button onclick="qty=Math.max(1,qty-1);draw()">−</button><input value="${qty}" onchange="qty=Math.max(1,+this.value||1);draw()"><button onclick="qty++;draw()">+</button></span><button class="btn o" style="flex:1" onclick="cartAdd(pr.id,qty);toast('🛒 Добавлено в корзину')">В корзину</button></div>
   <button class="btn g wide mt" onclick="toEst()">📋 ${inEst?`В смете: ${inEst.qty} ${pr.unit}`:'Добавить в смету проекта'}</button>
   ${pr.roles.length?`<div class="calcbox" id="calc"><b>Сколько нужно?</b><div class="note" style="margin:4px 0 10px">Постройте план комнаты, даже Г- или П-образной. Количество посчитается по реальной площади и упаковкам.</div><button class="btn wide" onclick="openCalc()">📐 Рассчитать количество</button></div>`:''}
   ${sv?`<div class="inst"><b>🔧 ${sv.name} — от ${byn(sv.price)}</b><div class="note">Мастера и цены — демо. Заявка привяжется к этому товару.</div><a class="btn sm mt" href="masters.html?service=${sv.id}&product=${pr.id}${ap?'&project='+ap.id:''}">Заказать установку</a></div>`:''}
  </div></div>
 ${A.length?`<h2>Аналоги${A.some(x=>x.stm)?' и СТМ ОМА':''}</h2><div class="pgrid">${A.map(x=>pcard(x,{actions:`<a class="btn sm g" href="product.html?id=${x.id}">${x.price<pr.price?'−'+byn(pr.price-x.price):'+'+byn(x.price-pr.price)}</a><a class="btn sm" href="catalog.html?cmp=${pr.id},${x.id}">Сравнить</a>`})).join('')}</div>`:''}
 ${rel.length?`<h2>С этим товаром берут</h2><div class="pgrid">${rel.map(x=>pcard(x)).join('')}</div>`:''}`;
 if(location.hash==='#calc'&&pr.roles.length){history.replaceState(null,'',location.pathname+location.search);openCalc()}
}
function toEst(){const p=ensureProject(pr.cat==='floor'?'living':'bath');const r=addLine(p,pr.id,qty);save();toast(r.dup?`Уже в смете «${esc(p.title)}» · <a href="smeta.html?project=${p.id}&focus=${pr.id}">открыть</a>`:`📋 В смете «${esc(p.title)}» · <a href="smeta.html?project=${p.id}&focus=${pr.id}">открыть</a>`);draw()}
function openCalc(){
 const ap=activeProject();target=ap?'cur':'new';
 $('#mcSub').textContent=pr.name;
 $('#mcRole').innerHTML=pr.roles.includes('tileFloor')&&pr.roles.includes('tileWall')?`<div class="fld">Куда укладываем</div><div class="seg mt">${[['tileFloor','На пол'],['tileWall','На стены'],['both','Пол и стены']].map(([k,t])=>`<button class="${roleSel===k?'on':''}" onclick="roleSel='${k}';openCalc()">${t}</button>`).join('')}</div>`:'';
 $('#mcProj').innerHTML=`<div class="fld">Где считать</div><div class="opts2"><label><input type="radio" name="tg" ${target==='new'?'checked':''} onchange="target='new'"><span><b>Новый расчёт</b><small>Создадим проект с этим товаром</small></span></label>${ap?`<label><input type="radio" name="tg" ${target==='cur'?'checked':''} onchange="target='cur'"><span><b>В текущий проект «${esc(ap.title)}»</b><small>Товар заменит типовую позицию, план сохранится</small></span></label>`:''}</div>`;
 $('#mCalc').classList.add('show');
}
function startCalc(){
 const roles=roleSel==='both'?['tileFloor','tileWall']:pr.cat==='tile'?[roleSel]:pr.roles;
 const task=pr.cat==='floor'||pr.cat==='paint'?'living':'bath';
 let p=target==='cur'?activeProject():null;
 if(!p)p=addProject(newProject({task,title:'Расчёт: '+pr.name.split(/[,«]/)[0].trim(),logText:`Проект создан из карточки товара «${pr.name}»`}));
 const r=room(p);
 roles.forEach(role=>{p.pinned[role]=pr.id;
  if(role==='tileWall'&&!r.walls.some(w=>w.finish==='tile'))r.walls.forEach(w=>w.finish='tile');
  if(role==='tileFloor')r.floor='tile';if(role==='laminate')r.floor='laminate';
  if(role==='paintWall'&&!r.walls.some(w=>w.finish==='paint'))r.walls.forEach(w=>w.finish='paint');if(role==='paintCeil')r.ceil='paint';});
 if(roleSel==='tileFloor'&&target==='new')r.walls.forEach(w=>w.finish='paint');
 if(roleSel==='tileWall'&&target==='new')r.floor='none';
 recalc(p);touchEst(p,`Выбран товар «${pr.name}» для расчёта`);setActive(p);save();
 location=`planner.html?project=${p.id}&pid=${pr.id}`;
}
draw();
</script></body></html>
