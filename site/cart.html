<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Корзина — ОМА Проект</title><link rel="stylesheet" href="style.css?v=202610292000"><link rel="stylesheet" href="app.css?v=202610292000"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="oma-skin.css?v=202610292000"></head><body><div id="chrome"></div>
<div class="wrap" id="app"></div>
<script src="oma-catalog.js?v=202610292000"></script><script src="oma-menu.js?v=202610292000"></script><script src="oma-social.js?v=202610292000"></script><script src="oma-furniture.js?v=202610292000"></script><script src="data.js?v=202610292000"></script><script src="geom.js?v=202610292000"></script><script src="calc.js?v=202610292000"></script><script src="oma-crops.js?v=202610292000"></script><script src="core.js?v=202610292000"></script><script src="plan.js?v=202610292000"></script><script src="omik.js?v=202610292000"></script><script>
const DATES=[1,2,3].map(d=>now()+d*DAY);
let o={delivery:'pickup',date:0,address:'',name:contact()?.name||'',phone:contact()?.phone?phoneFmt(contact().phone):''},done=null;
function draw(){
 chrome('cart');
 const s=load();
 if(done){$('#toast')?.classList.remove('show');return success()}
 if(!s.cart.length){$('#app').innerHTML=`<div class="crumbs"><a href="index.html">Главная</a> / Корзина</div><div class="card empty mt2"><img src="img/omik-think.png" alt=""><h2>Корзина пуста</h2><p class="note">Соберите смету в калькуляторе или добавьте товары из каталога.</p><a class="btn" href="planner.html">📐 Рассчитать ремонт</a> <a class="btn g" href="catalog.html">Каталог</a></div>`;return}
 const groups={};s.cart.forEach((i,ix)=>{const k=i.projectId||'_';(groups[k]=groups[k]||[]).push({...i,ix})});
 const tot=cartTotal(),ship=o.delivery==='delivery'&&tot<300?25:0;
 let h=`<div class="crumbs"><a href="index.html">Главная</a> / Корзина</div><h1>Корзина</h1><div class="g2"><div>`;
 Object.entries(groups).forEach(([k,items])=>{
  const p=k==='_'?null:getProject(k),stale=p&&p.cartRev!==p.est.rev;
  h+=`<div class="card pad"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px"><h3 style="margin:0">${p?`📋 Смета «${esc(p.title)}»`:'Отдельные товары'}</h3>${p?`<a class="btn ghost sm" href="smeta.html?project=${p.id}">Открыть смету</a>`:''}</div>
  ${stale?`<div class="banner warn" style="font-size:13px">Смета изменилась после добавления в корзину (например, вы поменяли план). <button class="btn sm" onclick="resync('${p.id}')">Обновить из сметы</button></div>`:''}
  <div class="est">${items.map(i=>{const pr=P(i.pid);return`<div class="ln"><span class="c-img">${pimg(pr,'sm')}</span><span class="nm"><a href="product.html?id=${pr.id}">${esc(pr.name)}</a><span class="basis">${byn(pr.price)} / ${pr.unit}</span></span>
   <span class="c-qty"><span class="qty"><button onclick="dq(${i.ix},-1)">−</button><input type="number" min="1" value="${i.qty}" onchange="setQ(${i.ix},this.value)"><button onclick="dq(${i.ix},1)">+</button><small>${pr.unit}</small></span></span><span class="r c-price"></span><span class="r c-sum"><b>${byn(pr.price*i.qty)}</b></span><span class="c-x"><button class="xbtn" onclick="del(${i.ix})">×</button></span></div>`}).join('')}</div>
  ${p?`<p class="note" style="margin-bottom:0">Количество из сметы. Если изменить его здесь, смета не изменится. <a href="masters.html?project=${p.id}" style="color:var(--blue);font-weight:700">Нужен мастер для этого проекта →</a></p>`:''}</div>`;
 });
 h+=`<div class="card pad"><h3>Получение</h3><div class="opts2">
  <label><input type="radio" name="dl" ${o.delivery==='pickup'?'checked':''} onchange="o.delivery='pickup';draw()"><span><b>Самовывоз из магазина ОМА</b><small>Бесплатно · соберём заказ к выбранному дню (демо-условия)</small></span></label>
  <label><input type="radio" name="dl" ${o.delivery==='delivery'?'checked':''} onchange="o.delivery='delivery';draw()"><span><b>Доставка</b><small>25 BYN, бесплатно от 300 BYN (демо-условия)</small></span></label></div>
  ${o.delivery==='delivery'?`<label class="fld mt">Адрес<input value="${esc(o.address)}" placeholder="Минск, ул. …" oninput="o.address=this.value"></label>`:''}
  <div class="fld mt2">Когда</div><div class="seg mt">${DATES.map((d,i)=>`<button class="${o.date===i?'on':''}" onclick="o.date=${i};draw()">${fmtDay(d)}</button>`).join('')}</div>
  <div class="f2 mt2"><label class="fld">Имя<input value="${esc(o.name)}" oninput="o.name=this.value" placeholder="Как к вам обращаться" autocomplete="name"></label><label class="fld">Телефон<input value="${esc(o.phone)}" oninput="o.phone=this.value" placeholder="+375 29 123-45-67" type="tel" inputmode="tel" autocomplete="tel"></label></div></div>`;
 h+=`</div><aside class="card side"><div class="note">Итого</div><div class="tot">${byn(tot+ship)}</div><div style="margin:10px 0 16px"><div class="row"><span>Товары, ${s.cart.length} поз.</span><b>${byn(tot)}</b></div><div class="row"><span>${o.delivery==='delivery'?'Доставка':'Самовывоз'}</span><b>${ship?byn(ship):'бесплатно'}</b></div></div>
  <button class="btn o wide" id="pay" onclick="order()">Оформить заказ (демо)</button>${currentUser()?`<p class="note" style="margin:8px 0 0">Вы вошли: ${esc(currentUser().name)}, ${phoneFmt(currentUser().phone)}</p>`:'<p class="note" style="margin:8px 0 0">Для оплаты нужен вход по номеру телефона — один раз. Корзина и расчёты работают без него.</p>'}<p class="note">⚠ Демонстрационное оформление: оплата не проводится, данные карты не запрашиваются, заказ в ОМА не уходит.</p></aside></div>
  <div class="mbar"><div><small>Итого · ${s.cart.length} поз.</small><b>${byn(tot+ship)}</b></div><button class="btn o" onclick="order()">Оформить заказ</button></div>`;
 $('#app').innerHTML=h;
}
const C=()=>load().cart;
function setQ(ix,v){C()[ix].qty=Math.max(1,Math.round(+v||1));save();draw()}
function dq(ix,d){const i=C()[ix];if(i.qty+d<1)return del(ix);i.qty+=d;save();draw()}
function del(ix){C().splice(ix,1);save();draw()}
function resync(id){cartSyncProject(getProject(id));toast('Корзина обновлена по смете');draw()}
function order(){
 if(o.delivery==='delivery'&&!o.address.trim()){toast('Укажите адрес доставки',false);return}
 if(!o.name.trim()){toast('Укажите, как к вам обращаться',false);document.querySelector('input[oninput^="o.name"]')?.focus();return}
 {const er=phoneErr(o.phone);if(er){toast(er,false);document.querySelector('input[oninput^="o.phone"]')?.focus();return}}
 // оплата — только для зарегистрированных: вход по номеру с кодом из SMS
 if(!currentUser())return gate('account',u=>{if(!o.name.trim())o.name=u.name;o.phone=phoneFmt(u.phone);draw();order()},'Для оплаты заказа нужен аккаунт ОМА.',{name:o.name.trim(),phone:o.phone});
 const s=load(),b=$('#pay');b.disabled=true;b.textContent='Оформляем…';
 setTimeout(()=>{
  const tot=cartTotal(),ship=o.delivery==='delivery'&&tot<300?25:0,pids=[...new Set(s.cart.map(i=>i.projectId).filter(Boolean))];
  done={no:'D-'+(10000+Math.floor(Math.random()*89999)),at:now(),total:tot+ship,items:s.cart.length,delivery:o.delivery,date:DATES[o.date],projects:pids};
  s.orders.unshift(done);
  pids.forEach(id=>{const p=getProject(id);if(p){p.est.status='ordered';p.status='ordered';p.order=done.no;log(p,`Заказ ${done.no} оформлен (демо): ${o.delivery==='delivery'?'доставка':'самовывоз'} ${fmtDay(done.date)}`)}});
  s.cart=[];save();draw();scrollTo(0,0);
 },800);
}
function success(){
 const p=getProject(done.projects[0]);
 $('#app').innerHTML=`<div class="card empty" style="margin-top:24px"><img src="img/omik-happy.png" alt="" style="width:160px"><h1>Заказ ${done.no} оформлен</h1><p class="lead" style="margin:0 auto 18px">${byn(done.total)} · ${done.items} поз. · ${done.delivery==='delivery'?'доставка':'самовывоз'} ${fmtDay(done.date)}</p>
  <p class="note">Демо: заказ сохранён в проекте, реального заказа и оплаты нет.</p>
  <div class="seg" style="justify-content:center;margin-top:14px">${p?`<a class="btn" href="masters.html?project=${p.id}">👷 Найти мастера на работы</a><a class="btn g" href="smeta.html?project=${p.id}">Открыть проект</a>`:''}<a class="btn g" href="projects.html">Мои проекты</a></div></div>`;
}
draw();
</script></body></html>
