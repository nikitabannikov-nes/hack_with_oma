<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Мастера и услуги — ОМА Проект</title><link rel="stylesheet" href="style.css?v=202610290100"><link rel="stylesheet" href="app.css?v=202610290100"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="oma-skin.css?v=202610290100">
<style>.svcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}.sv{border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px 14px;cursor:pointer;text-align:left;font:inherit}.sv.on{border-color:var(--blue);background:var(--blue-l)}.sv b{display:block;font-size:14px}.sv small{color:var(--mute)}.mcard .meta{font-size:13px;color:var(--mute)}.mcard .pr{font-size:18px;font-weight:800}</style></head><body><div id="chrome"></div>
<div class="wrap">
 <div class="crumbs"><a href="index.html">Главная</a> / Мастера и услуги</div>
 <h1>Мастера и услуги</h1><p class="lead">Выберите работу — покажем мастеров и ориентировочную стоимость по вашему проекту. Заявку можно привязать к смете и товарам.</p>
 <div id="ctxb"></div>
 <div class="chips" id="scats" style="margin-bottom:12px"></div>
 <div class="svcs" id="svcs"></div>
 <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:26px 0 12px"><h2 style="margin:0" id="mh">Мастера</h2>
  <div class="seg"><select id="sort" style="border:1px solid var(--line);border-radius:10px;padding:8px;font:inherit;font-size:13px"><option value="rating">По рейтингу</option><option value="date">Ближайшая дата</option><option value="price">Дешевле</option></select></div></div>
 <div class="mgrid" id="mgrid"></div>
 <h2 id="requests">Мои заявки</h2><div id="reqs"></div>
</div>
<div class="modal-bg" id="mReq" onclick="if(event.target===this)this.classList.remove('show')"><form class="modal" style="max-width:560px" onsubmit="event.preventDefault();submitReq()" id="fReq"></form></div>
<div class="modal-bg" id="mM" onclick="if(event.target===this)this.classList.remove('show')"><div class="modal" id="mMb"></div></div>
<script src="oma-catalog.js?v=202610290100"></script><script src="oma-menu.js?v=202610290100"></script><script src="oma-social.js?v=202610290100"></script><script src="data.js?v=202610290100"></script><script src="geom.js?v=202610290100"></script><script src="calc.js?v=202610290100"></script><script src="core.js?v=202610290100"></script><script src="plan.js?v=202610290100"></script><script src="omik.js?v=202610290100"></script><script>
const proj0=getProject(qp('project')),prod0=P(qp('product'));
if(proj0)setActive(proj0);
chrome('masters');
let scat=qp('service')?svc(qp('service')).cat:'',sid=qp('service')||'',f={};
function ctxBanner(){
 let h='';
 if(prod0)h+=omikTip('ok',`<b>Установка для товара «${esc(prod0.name)}».</b> Заявка будет связана с этим товаром.`,'ok');
 else if(proj0){const a=proj0.calc?.areas||{};h+=omikTip('hi',`<b>Проект «${esc(proj0.title)}»</b>: ${areaSummary(proj0)||'нет объёмов'}. Стоимость работ посчитана по объёмам из плана — ориентировочно.`)}
 $('#ctxb').innerHTML=h;
}
function draw(){
 $('#scats').innerHTML=`<button class="${!scat?'st bl':''}" onclick="scat='';sid='';draw()">Все работы</button>`+Object.entries(SVC_CATS).map(([k,t])=>`<button style="${scat===k?'border-color:var(--blue);color:var(--blue)':''}" onclick="scat='${k}';sid='';draw()">${t}</button>`).join('');
 const S=SERVICES.filter(s=>!scat||s.cat===scat),p=proj0||activeProject();
 $('#svcs').innerHTML=S.map(s=>{const e=svcEstimate(s,p);return`<button class="sv ${sid===s.id?'on':''}" onclick="sid=sid==='${s.id}'?'':'${s.id}';scat='${s.cat}';draw()"><b>${s.name}</b><small>от ${byn(s.price)} / ${s.unit}${s.area&&p&&e.q?` · по проекту ${num(e.q,1)} ${s.unit} ≈ ${byn(e.sum)}`:''}</small></button>`}).join('');
 const cat=sid?svc(sid).cat:scat;
 let M=MASTERS.filter(m=>!cat||m.cats.includes(cat));
 const so=$('#sort').value;M.sort((a,b)=>so==='date'?a.days-b.days:so==='price'?a.from-b.from:b.rating-a.rating);
 $('#mh').textContent=`Мастера${sid?': '+svc(sid).name.toLowerCase():cat?': '+SVC_CATS[cat].toLowerCase():''} · ${M.length}`;
 $('#mgrid').innerHTML=M.map(m=>`<div class="card mcard"><div class="hd">${mAv(m)}<div><b>${m.name}</b> <span class="tag demo">демо-профиль</span><div class="meta">★ ${m.rating} · ${m.jobs} заказов · ${m.district} р-н</div></div></div>
  <div class="meta">${m.about}</div><div class="chips">${m.cats.map(c=>`<span class="st">${SVC_CATS[c]}</span>`).join('')}</div>
  <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-top:auto"><div><div class="pr">от ${byn(m.from)}</div><div class="meta">ближайший выезд: ${fmtDay(now()+m.days*DAY)}</div></div></div>
  <div class="seg"><button class="btn sm g" type="button" onclick="showM('${m.id}')">Подробнее</button><button class="btn sm o" type="button" onclick="openReq('${m.id}')">Оставить заявку</button></div></div>`).join('')||'<p class="note">Нет мастеров по этой работе.</p>';
 drawReqs();
}
function showM(id){const m=master(id);$('#mMb').innerHTML=`<button class="x" onclick="$('#mM').classList.remove('show')">×</button><div class="hd" style="display:flex;gap:12px;align-items:center">${mAv(m)}<div><h2 style="margin:0">${m.name}</h2><div class="note">★ ${m.rating} · ${m.jobs} заказов · ${m.district} р-н · демо-профиль</div></div></div><p>${m.about}</p><h3 style="font-size:15px">Услуги и цены (ориентировочно)</h3>${SERVICES.filter(s=>m.cats.includes(s.cat)).map(s=>`<div class="row" style="font-size:14px"><span>${s.name}</span><b>от ${byn(s.price)} / ${s.unit}</b></div>`).join('')}<p class="note">Рейтинги, отзывы и проверка мастеров в прототипе не реализованы: это демонстрационные данные.</p><button class="btn o wide" onclick="$('#mM').classList.remove('show');openReq('${m.id}')">Оставить заявку</button>`;$('#mM').classList.add('show')}
function openReq(mid){
 const s=load(),p=proj0||activeProject(),cat=sid?svc(sid).cat:scat;
 f={master:mid||'',service:sid||SERVICES.find(x=>!cat||x.cat===cat)?.id||'svc_mixer',projectId:p?.id||'',productId:prod0?.id||'',date:1,slot:'09:00–12:00',address:'',comment:''};
 if(mid&&!master(mid).cats.includes(svc(f.service).cat))f.service=SERVICES.find(x=>master(mid).cats.includes(x.cat)).id;
 drawForm();$('#mReq').classList.add('show');
}
function drawForm(){
 const s=load(),p=getProject(f.projectId),sv=svc(f.service),e=svcEstimate(sv,p),pr=P(f.productId);
 const ms=MASTERS.filter(m=>m.cats.includes(sv.cat));
 const prodOpts=p?p.est.lines.map(l=>P(l.pid)).filter(x=>x&&x.service===f.service):[];
 $('#fReq').innerHTML=`<button type="button" class="x" onclick="$('#mReq').classList.remove('show')">×</button><h2 style="margin:0 0 14px">Заявка мастеру</h2>
  <label class="fld">Услуга<select onchange="f.service=this.value;if(f.master&&!master(f.master).cats.includes(svc(this.value).cat))f.master='';drawForm()">${SERVICES.map(x=>`<option value="${x.id}" ${x.id===f.service?'selected':''}>${x.name} — от ${byn(x.price)}/${x.unit}</option>`).join('')}</select></label>
  <label class="fld mt">Исполнитель<select onchange="f.master=this.value"><option value="">ОМА подберёт свободного мастера</option>${ms.map(m=>`<option value="${m.id}" ${m.id===f.master?'selected':''}>${m.name} · ★ ${m.rating}</option>`).join('')}</select></label>
  <div class="f2 mt"><label class="fld">Дата<select onchange="f.date=+this.value">${[1,2,3,4,5,6,7].map(d=>`<option value="${d}" ${f.date===d?'selected':''}>${fmtDay(now()+d*DAY)}</option>`).join('')}</select></label><label class="fld">Время<select onchange="f.slot=this.value">${['09:00–12:00','12:00–15:00','15:00–18:00'].map(t=>`<option ${f.slot===t?'selected':''}>${t}</option>`).join('')}</select></label></div>
  <label class="fld mt">Адрес<input required value="${esc(f.address)}" placeholder="Минск, ул. …" oninput="f.address=this.value"></label>
  <label class="fld mt">Проект<select onchange="f.projectId=this.value;drawForm()"><option value="">Без проекта</option>${s.projects.map(x=>`<option value="${x.id}" ${x.id===f.projectId?'selected':''}>${esc(x.title)}</option>`).join('')}</select></label>
  ${pr?`<div class="banner mt" style="font-size:13px">Связанный товар: <b>${esc(pr.name)}</b> <button type="button" class="btn ghost sm" onclick="f.productId='';drawForm()">отвязать</button></div>`:prodOpts.length?`<label class="fld mt">Товар из сметы<select onchange="f.productId=this.value;drawForm()"><option value="">—</option>${prodOpts.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></label>`:''}
  <label class="fld mt">Комментарий<textarea rows="2" oninput="f.comment=this.value" placeholder="Этаж, доступ, пожелания">${esc(f.comment)}</textarea></label>
  <div class="banner mt" style="font-size:14px">Ориентировочно: <b>${byn(e.sum)}</b>${sv.area?` (${num(e.q,1)} ${sv.unit} × ${byn(sv.price)}${p?', объём из проекта':''})`:''}${p?` · материалы проекта: ${p.est.lines.length} поз. на ${byn(estTotal(p))}`:''}</div>
  ${sv.area&&!p?`<p class="note" style="color:#c76b00">Без проекта объём неизвестен — мастер уточнит его на месте.</p>`:''}
  <button class="btn o wide mt">Отправить заявку</button><p class="note">Демо: заявка сохраняется в браузере, мастеру не отправляется. Статусы можно продвинуть вручную, чтобы показать сценарий.</p>`;
}
function submitReq(){
 const sv=svc(f.service),p=getProject(f.projectId),e=svcEstimate(sv,p);
 if(!f.address.trim()){toast('Укажите адрес',false);return}
 const r=addRequest({service:f.service,master:f.master||null,projectId:f.projectId||null,productId:f.productId||null,date:now()+f.date*DAY,slot:f.slot,address:f.address,comment:f.comment,estimate:e.sum,qty:e.q});
 $('#mReq').classList.remove('show');toast(`Заявка ${r.id} создана`);draw();location.hash='requests';$('#requests').scrollIntoView();
}
function drawReqs(){
 const R=load().requests;
 $('#reqs').innerHTML=R.length?R.map(r=>{const sv=svc(r.service),m=master(r.master),p=getProject(r.projectId),pr=P(r.productId);
  return`<div class="card req"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><div><b style="font-size:16px">${r.id} · ${sv.name}</b><div class="note">${fmtDay(r.date)}, ${r.slot} · ${esc(r.address)} · ≈ ${byn(r.estimate)}</div></div><span class="st ${r.status===3?'gr':r.status===2?'bl':'or'}">${REQ_ST[r.status]}</span></div>
   <div class="stepper">${REQ_ST.map((t,i)=>`<div class="${i<=r.status?'d':''}">${t}${r.statusAt[i]?`<br><small>${fmtDate(r.statusAt[i])}</small>`:''}</div>`).join('')}</div>
   <div class="row" style="font-size:13px"><span>Исполнитель</span><b>${m?m.name:r.status>=2?'Назначен ОМА (демо)':'подбирается'}</b></div>
   ${p?`<div class="row" style="font-size:13px"><span>Проект</span><b><a href="smeta.html?project=${p.id}" style="color:var(--blue)">${esc(p.title)}</a></b></div>`:''}${pr?`<div class="row" style="font-size:13px"><span>Товар</span><b><a href="product.html?id=${pr.id}" style="color:var(--blue)">${esc(pr.name)}</a></b></div>`:''}
   ${r.comment?`<div class="note">💬 ${esc(r.comment)}</div>`:''}
   <div class="seg mt">${r.status<3?`<button class="btn sm g" onclick="advance('${r.id}')">Следующий статус (демо) →</button>`:''}${p?`<a class="btn sm" href="smeta.html?project=${p.id}">Открыть проект</a>${p.est.status!=='ordered'?`<button class="btn sm o" onclick="cartSyncProject(getProject('${p.id}'));toast('Материалы проекта в корзине · <a href=cart.html>открыть</a>')">🛒 Материалы в корзину</button>`:''}`:''}${pr&&!p?`<button class="btn sm o" onclick="quickCart('${pr.id}')">🛒 Купить товар</button>`:''}${!p?`<a class="btn sm g" href="catalog.html?q=${encodeURIComponent(sv.name.split(' ').pop())}">Подобрать материалы</a>`:''}</div></div>`}).join(''):`<div class="card empty"><img src="img/omik-ok.png" alt=""><p class="note">Заявок пока нет.</p></div>`;
}
function advance(id){const r=load().requests.find(x=>x.id===id);r.status=Math.min(3,r.status+1);r.statusAt[r.status]=now();if(r.status===2&&!r.master)r.master=MASTERS.find(m=>m.cats.includes(svc(r.service).cat)).id;const p=getProject(r.projectId);if(p)log(p,`Заявка ${r.id}: ${REQ_ST[r.status]}`);save();draw()}
$('#sort').onchange=draw;
ctxBanner();draw();
if(location.hash==='#new')openReq();
if(location.hash==='#requests')setTimeout(()=>$('#requests').scrollIntoView(),50);
</script></body></html>
