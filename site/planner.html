<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2D-калькулятор помещения — ОМА Проект</title><link rel="stylesheet" href="style.css?v=202610272326"><link rel="stylesheet" href="app.css?v=202610272326"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="oma-skin.css?v=202610272326"></head><body><div id="chrome"></div>
<div class="wrap">
 <div class="crumbs"><a href="index.html">Главная</a> / 2D-калькулятор</div>
 <div style="display:flex;justify-content:space-between;gap:16px;align-items:flex-end;flex-wrap:wrap">
  <div><h1>План помещения и расчёт</h1><p class="lead" style="margin-bottom:10px">Выберите форму или нарисуйте контур по точкам. Площади считаются по координатам вершин, а не по ограничивающему прямоугольнику.</p></div>
  <label class="fld" style="min-width:260px">Проект<input id="pTitle"></label>
 </div>
 <div id="ban"></div>
 <div class="rtabs" id="rtabs"></div>
 <div class="pl">
  <div>
   <div class="canvas" id="cv">
    <svg id="svg"></svg>
    <div class="ctool">
     <div class="grp"><button id="mEdit" class="on" title="Двигать вершины, проёмы и вычеты">✋ Редактировать</button><button id="mDraw" title="Нарисовать новый контур по точкам">✏️ Нарисовать</button></div>
     <div class="grp"><button onclick="zoom(1.2)" title="Увеличить">＋</button><button onclick="zoom(1/1.2)" title="Уменьшить">－</button><button onclick="center()" title="Центрировать план">⌖</button></div>
     <button id="bSnap" class="on" title="Привязка к сетке 5 см и к осям">Привязка</button><button id="bAll" onclick="fitAll()" title="Показать все помещения">🏠 Весь план</button><button id="bUnder" onclick="showUnder=!showUnder;drawCanvas()" title="Показать фото планировки под планом">📷 Подложка</button>
    </div>

    <div class="legend"><span><i style="background:#0057d6"></i>плитка</span><span><i style="background:#ff9a1a"></i>покраска</span><span><i style="background:#9aa3b5"></i>без отделки</span><span><i style="background:#3aa0e8"></i>окно</span><span>⌒ дверь</span><span><i style="background:repeating-linear-gradient(45deg,#9aa3b5 0 2px,#fff 2px 4px)"></i>вычет</span></div>
    <div class="hintbar" id="hint"></div>
   </div>
       <div class="drawbar"><button id="bDelV" style="display:none">🗑 Удалить вершину</button><button id="bClose" style="display:none">✔ Замкнуть контур</button><button id="bUndo" style="display:none">↶ Точка</button><button id="bCancel" style="display:none">✕ Отмена</button></div>
   <div class="card pad mt2" id="res"></div>
  </div>
  <aside class="card pad" style="margin:0" id="panel"></aside>
 </div>
</div>
<div class="modal-bg" id="mRoom" onclick="if(event.target===this)this.classList.remove('show')"><div class="modal">
 <button class="x" onclick="$('#mRoom').classList.remove('show')">×</button>
 <h2 style="margin:0 0 12px">Новое помещение</h2>
 <div class="fld">Тип помещения</div><div class="seg mt" id="nrType"></div>
 <div class="fld mt2">Форма</div><div class="tpls mt" id="nrTpl"></div>
 <button class="btn o wide mt2" onclick="addRoom()">Добавить</button>
</div></div>
<script src="oma-catalog.js?v=202610272326"></script><script src="oma-menu.js?v=202610272326"></script><script src="oma-social.js?v=202610272326"></script><script src="data.js?v=202610272326"></script><script src="geom.js?v=202610272326"></script><script src="calc.js?v=202610272326"></script><script src="core.js?v=202610272326"></script><script src="plan.js?v=202610272326"></script><script src="omik.js?v=202610272326"></script><script>
// ---------- Проект и помещение ----------
let p=null;
if(qp('new')){p=addProject(newProject({task:qp('task')||'bath',title:qp('title')||RT[qp('task')||'bath'].name}))}
else p=activeProject()||addProject(newProject({task:'bath',title:'Ванная'}));
setActive(p);
if(qp('new')){const u=new URLSearchParams(location.search);u.delete('new');u.delete('task');u.delete('title');u.set('project',p.id);history.replaceState(null,'','planner.html?'+u)}
if(qp('room')&&p.rooms.some(r=>r.id===qp('room')))p.activeRoom=qp('room');
window.OMIK_CTX={page:'planner',projectId:p.id};
chrome('planner');
const R=()=>room(p);
let showUnder=true,v=null,mode='edit',selV=null,selWall=null,drawPts=[],cursor=null,snap=true,tab=qp('tab')||'shape',drag=null,lastLog=0;
const svg=$('#svg'),cv=$('#cv');
const fromPid=qp('pid');

function banner(){
 let h='';
 if(fromPid&&P(fromPid)){const pr=P(fromPid);h+=`<div class="tip ok"><img src="img/omik-idea.png"><div><b>Считаем количество для «${esc(pr.name)}».</b> Товар уже закреплён в смете. Задайте форму и размеры помещения, затем вернитесь в смету: количество будет посчитано по реальной площади.<div class="mt"><a class="btn sm o" href="smeta.html?project=${p.id}&focus=${fromPid}">Рассчитать и вернуться в смету →</a></div></div></div>`}
 if(qp('from')==='omik')h+=`<div class="tip"><img src="img/omik-hi.png"><div><b>Омик создал план по вашим размерам.</b> Если комната не прямоугольная, выберите Г- или П-образную форму или нарисуйте контур. Расчёт обновится сам.</div></div>`;
 if(qp('from')==='photo')h+=`<div class="tip ok"><img src="img/omik-happy.png"><div><b>Планировка перенесена: ${p.rooms.length} помещений, ${num(p.rooms.reduce((s,r)=>s+Geom.area(r.pts),0),1)} м².</b> Фото лежит подложкой — сверьте контуры. Другие комнаты показаны серым, клик по ним переключает помещение. Проверьте двери и окна и выберите отделку на вкладке «Отделка».<div class="mt"><a class="btn sm o" href="smeta.html?project=${p.id}">Смета на весь объект →</a></div></div></div>`;
 if(qp('from')==='smeta')h+=`<div class="tip"><img src="img/omik-think.png"><div><b>Измените геометрию — смета пересчитается.</b> Количества, которые вы правили вручную, не перезапишутся: смета покажет расхождение с расчётом.</div></div>`;
 $('#ban').innerHTML=h;
}
$('#pTitle').value=p.title;$('#pTitle').onchange=e=>{p.title=e.target.value.trim()||p.title;save();chrome('planner')};

// ---------- Изменения ----------
function commit(text,keepPanel){
 const r=R();
 const before=JSON.stringify(p.est.lines.map(l=>[l.pid,l.qty,l.calcQty]));
 recalc(p);
 const after=JSON.stringify(p.est.lines.map(l=>[l.pid,l.qty,l.calcQty]));
 if(before!==after){p.est.rev++;if(['sent','approved','changes'].includes(p.est.status))p.est.dirty=true}
 if(text&&now()-lastLog>30000){log(p,text);lastLog=now()}
 p.updated=now();save();if(keepPanel){renderTabs();drawCanvas();drawResults();chrome('planner')}else renderAll();
}
function toPoly(r){if(r.shape.kind!=='poly'){r.shape={kind:'poly',from:r.shape.kind,params:r.shape.params}}}

// ---------- Холст ----------
function size(){return[cv.clientWidth,cv.clientHeight]}
function center(){const[W,H]=size();v=Plan.fit(R().pts.length?R().pts:[[0,0],[3,3]],W,H,70);drawCanvas()}
function fitAll(){const[W,H]=size();v=Plan.fit(p.rooms.flatMap(r=>r.pts),W,H,50);drawCanvas()}
function zoom(k,cx,cy){const[W,H]=size();cx=cx??W/2;cy=cy??H/2;const s=Math.max(15,Math.min(600,v.s*k)),kk=s/v.s;v.ox=cx-(cx-v.ox)*kk;v.oy=cy-(cy-v.oy)*kk;v.s=s;drawCanvas()}
function world(e){const b=svg.getBoundingClientRect();return[(e.clientX-b.left-v.ox)/v.s,(e.clientY-b.top-v.oy)/v.s]}
function snapPt(pt,ref){
 if(!snap)return pt.map(Geom.r2);
 let[x,y]=pt.map(c=>Math.round(c*20)/20);const tol=10/v.s;
 (ref||[]).forEach(q=>{if(q){if(Math.abs(pt[0]-q[0])<tol)x=q[0];if(Math.abs(pt[1]-q[1])<tol)y=q[1]}});
 return[Geom.r2(x),Geom.r2(y)];
}
function drawCanvas(){
 const[W,H]=size(),r=R(),val=Geom.validate(r);
 svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
 const extra={under:p.underlay&&showUnder?p.underlay:null,ghosts:p.rooms.filter(x=>x.id!==r.id)};
 svg.innerHTML=mode==='draw'?Plan.draw({pts:[],walls:[]},v,{W,H,drawPts,cursor,...extra}):Plan.draw(r,v,{W,H,interactive:true,selV,selWall,valid:val.ok,numbers:true,id:'c',floorMat:floorLook(p,r),...extra});
 $('#bUnder').style.display=p.underlay?'':'none';$('#bUnder').classList.toggle('on',showUnder);$('#bAll').style.display=p.rooms.length>1?'':'none';
 $('#hint').textContent=mode==='draw'?(drawPts.length<3?`Кликайте по сетке, чтобы ставить вершины (${drawPts.length}). Привязка к осям помогает строить прямые углы.`:'Кликните по первой (оранжевой) точке или нажмите «Замкнуть контур».'):selV!=null?`Вершина ${selV+1}: перетащите или удалите. Колесо мыши — масштаб.`:'Тяните вершины и «+» на стенах, перетаскивайте проёмы и вычеты. Фон — сдвиг плана.';
 $('#bDelV').style.display=mode==='edit'&&selV!=null&&r.pts.length>3?'':'none';
 ['bClose','bUndo','bCancel'].forEach(id=>$('#'+id).style.display=mode==='draw'?'':'none');
 $('#bClose').disabled=drawPts.length<3;
}
svg.addEventListener('pointerdown',e=>{
 const r=R(),w=world(e),t=e.target.closest('[data-v],[data-m],[data-x],[data-o],[data-w],[data-g]');
 if(mode==='edit'&&t?.dataset.g){p.activeRoom=t.dataset.g;selV=null;selWall=null;save();renderTabs();renderPanel();drawCanvas();drawResults();return}
 if(mode==='draw'){
  const pt=snapPt(w,[drawPts[drawPts.length-1],drawPts[0]]);
  if(drawPts.length>=3&&Geom.segLen(pt,drawPts[0])*v.s<14){closeDraw();return}
  if(!drawPts.length||Geom.segLen(pt,drawPts[drawPts.length-1])>=Geom.MIN_SEG)drawPts.push(pt);drawCanvas();return;
 }
 svg.setPointerCapture(e.pointerId);
 if(t?.dataset.v!=null){selV=+t.dataset.v;selWall=null;drag={k:'v',i:selV}}
 else if(t?.dataset.m!=null){const i=+t.dataset.m;insertAt(i,+t.dataset.t||0.5);selV=i+1;drag={k:'v',i:i+1}}
 else if(t?.dataset.x!=null){const x=r.excl.find(x=>x.id===t.dataset.x);drag={k:'x',x,dx:w[0]-x.x,dy:w[1]-x.y};tab='open'}
 else if(t?.dataset.o!=null){drag={k:'o',o:r.openings.find(o=>o.id===t.dataset.o)};tab='open'}
 else if(t?.dataset.w!=null){selWall=+t.dataset.w;selV=null;tab='walls';drag=null;renderAll();return}
 else{selV=null;drag={k:'pan',x:e.clientX,y:e.clientY,ox:v.ox,oy:v.oy}}
 drawCanvas();
});
svg.addEventListener('pointermove',e=>{
 const r=R(),w=world(e);
 if(mode==='draw'){cursor=snapPt(w,[drawPts[drawPts.length-1],drawPts[0]]);drawCanvas();return}
 if(!drag)return;
 if(drag.k==='pan'){v.ox=drag.ox+e.clientX-drag.x;v.oy=drag.oy+e.clientY-drag.y;drawCanvas();return}
 if(drag.k==='v'){const n=r.pts.length,i=drag.i;r.pts=Geom.movePoint(r.pts,i,snapPt(w,[r.pts[(i+n-1)%n],r.pts[(i+1)%n]]));toPoly(r);drag.moved=true}
 if(drag.k==='x'){const x=drag.x;x.x=Geom.r2(Math.round((w[0]-drag.dx)*20)/20);x.y=Geom.r2(Math.round((w[1]-drag.dy)*20)/20);drag.moved=true}
 if(drag.k==='o'){const o=drag.o,i=r.walls.findIndex(q=>q.id===o.wallId),A=r.pts[i],B=r.pts[(i+1)%r.pts.length],L=Geom.segLen(A,B);
  const t=((w[0]-A[0])*(B[0]-A[0])+(w[1]-A[1])*(B[1]-A[1]))/L;o.off=Geom.r2(Math.max(0,Math.min(L-o.w,Math.round((t-o.w/2)*20)/20)));drag.moved=true}
 recalc(p);drawCanvas();drawResults();
});
svg.addEventListener('pointerup',()=>{if(drag&&drag.moved)commit('Геометрия изменена на плане');else if(drag)renderPanel();drag=null});
svg.addEventListener('pointerleave',()=>{if(mode==='draw'){cursor=null;drawCanvas()}});
svg.addEventListener('wheel',e=>{e.preventDefault();const b=svg.getBoundingClientRect();zoom(e.deltaY<0?1.12:1/1.12,e.clientX-b.left,e.clientY-b.top)},{passive:false});
addEventListener('keydown',e=>{if(e.target.closest('input,select,textarea'))return;if((e.key==='Delete'||e.key==='Backspace')&&selV!=null)delV();if(e.key==='Escape'&&mode==='draw')setMode('edit')});
addEventListener('resize',()=>drawCanvas());

function insertAt(i,tt=0.5){
 const r=R(),A=r.pts[i],B=r.pts[(i+1)%r.pts.length],L=Geom.segLen(A,B),L1=L*tt,w=r.walls[i];
 r.pts=Geom.insertVertex(r.pts,i,tt);
 const nw={id:uid(),finish:w.finish,h:w.h};r.walls.splice(i+1,0,nw);
 // Проём остаётся целым: переносим его в ту половину, где лежит его середина, и прижимаем внутрь
 r.openings.filter(o=>o.wallId===w.id).forEach(o=>{
  if(o.off+o.w/2>=L1){o.wallId=nw.id;o.off=Geom.r2(Math.max(0,Math.min(o.off-L1,L-L1-o.w)))}
  else o.off=Geom.r2(Math.max(0,Math.min(o.off,L1-o.w)));
 });
 toPoly(r);
}
function delV(){
 const r=R(),i=selV,n=r.pts.length;if(i==null||n<=3)return;
 const prev=(i+n-1)%n,Lp=Geom.segLen(r.pts[prev],r.pts[i]),gone=r.walls[i],keep=r.walls[prev];
 r.openings.filter(o=>o.wallId===gone.id).forEach(o=>{o.wallId=keep.id;o.off=Geom.r2(o.off+Lp)});
 r.walls.splice(i,1);r.pts=Geom.removeVertex(r.pts,i);
 const k=r.walls.indexOf(keep),Ln=Geom.segLen(r.pts[k],r.pts[(k+1)%r.pts.length]);
 r.openings.filter(o=>o.wallId===keep.id).forEach(o=>{o.off=Geom.r2(Math.max(0,Math.min(o.off,Ln-o.w)))});
 selV=null;toPoly(r);commit('Удалена вершина контура');
}
function setMode(m){mode=m;drawPts=[];cursor=null;selV=null;$('#mEdit').classList.toggle('on',m==='edit');$('#mDraw').classList.toggle('on',m==='draw');if(m==='draw'){toast('Режим рисования: кликайте по сетке, чтобы поставить вершины')}drawCanvas()}
function closeDraw(){
 if(drawPts.length<3)return;
 const r=R(),tmp={...r,pts:drawPts,walls:drawPts.map(()=>({id:'t',finish:'paint'})),openings:[],excl:[]};
 if(Geom.selfIntersects(drawPts)){toast('Контур пересекает сам себя — поставьте точки по-другому',false);return}
 const fin=r.walls[0]?.finish||'paint';
 r.pts=drawPts.map(p=>[...p]);r.walls=r.pts.map(()=>({id:uid(),finish:fin,h:null}));r.openings=[];r.excl=[];r.shape={kind:'poly',from:'draw'};
 mode='edit';drawPts=[];$('#mEdit').classList.add('on');$('#mDraw').classList.remove('on');
 commit('Нарисован новый контур помещения');center();toast('Контур замкнут. Добавьте дверь и окна на вкладке «Проёмы»');
}
$('#mEdit').onclick=()=>setMode('edit');$('#mDraw').onclick=()=>setMode('draw');
$('#bSnap').onclick=()=>{snap=!snap;$('#bSnap').classList.toggle('on',snap)};
$('#bDelV').onclick=delV;$('#bClose').onclick=closeDraw;$('#bUndo').onclick=()=>{drawPts.pop();drawCanvas()};$('#bCancel').onclick=()=>setMode('edit');

// ---------- Панель ----------
const TABS=[['shape','Форма'],['walls','Стены'],['open','Проёмы и вычеты'],['fin','Отделка']];
function renderTabs(){
 $('#rtabs').innerHTML=p.rooms.map(r=>{const ok=Geom.validate(r).ok;return`<button class="${r.id===p.activeRoom?'on':''} ${ok?'':'err'}" onclick="selRoom('${r.id}')">${RT[r.type]?.icon||''} ${esc(r.name)} · ${ok?num(Geom.area(r.pts),1)+' м²':'ошибка'}</button>`}).join('')+`<button onclick="openAddRoom()">＋ Помещение</button>`;
}
function selRoom(id){p.activeRoom=id;selV=null;selWall=null;save();renderAll();center()}
function renderPanel(){
 const r=R(),sh=r.shape,tp=Geom.TEMPLATES[sh.kind];
 let h=`<div class="ptabs">${TABS.map(([k,t])=>`<button class="${k===tab?'on':''}" onclick="tab='${k}';renderPanel()">${t}</button>`).join('')}</div>`;
 if(tab==='shape'){
  h+=`<div class="f2"><label class="fld">Название<input value="${esc(r.name)}" onchange="R().name=this.value||R().name;commit()"></label>
   <label class="fld">Тип<select onchange="setType(this.value)">${Object.entries(RT).map(([k,t])=>`<option value="${k}" ${k===r.type?'selected':''}>${t.name}</option>`).join('')}</select></label></div>
   <div class="fld mt2">Форма помещения</div><div class="tpls mt">${Object.entries(Geom.TEMPLATES).map(([k,t])=>`<button class="${sh.kind===k?'on':''}" onclick="setTpl('${k}')">${Plan.tplIcon(k)}${t.name}</button>`).join('')}<button onclick="location='import.html?project=${p.id}'"><svg viewBox="0 0 48 38"><rect x="6" y="6" width="36" height="26" rx="4" fill="#fff1de" stroke="#ff9a1a" stroke-width="2"/><circle cx="24" cy="19" r="7" fill="none" stroke="#ff9a1a" stroke-width="2"/></svg>По фото</button><button class="${sh.kind==='poly'?'on':''}" onclick="setMode('draw')"><svg viewBox="0 0 48 38"><polygon points="6,30 10,6 28,10 42,4 40,32 22,26" fill="#e8f0fd" stroke="#0057d6" stroke-width="2"/></svg>Произвольная</button></div>`;
  if(tp)h+=`<div class="f2 mt2">${tp.params.map(([k,l])=>`<label class="fld">${l}, м<input type="number" step="0.05" min="0.3" max="30" value="${sh.params[k]}" oninput="setParam('${k}',this.value)"></label>`).join('')}</div><p class="note" id="tplErr" style="color:var(--red)"></p>`;
  else h+=`<div class="banner mt2" style="font-size:13px">Свободный многоугольник: ${r.pts.length} вершин. Перетаскивайте вершины, добавляйте точки кнопкой «+» на стене, меняйте длины на вкладке «Стены» или координаты ниже.</div>`;
  h+=`<label class="fld mt2">Высота потолка, м<input type="number" step="0.05" min="1.8" max="6" value="${r.h}" onchange="setH(this.value)"></label>
   <details class="mt2" ${sh.kind==='poly'?'open':''}><summary style="cursor:pointer;font-weight:700;font-size:13px">Координаты вершин (точный ввод)</summary>
   <table class="wt mt"><tr><th>№</th><th>X, м</th><th>Y, м</th><th></th></tr>${r.pts.map((q,i)=>`<tr class="${selV===i?'sel':''}"><td>${i+1}</td><td><input type="number" step="0.05" value="${q[0]}" onchange="setXY(${i},0,this.value)"></td><td><input type="number" step="0.05" value="${q[1]}" onchange="setXY(${i},1,this.value)"></td><td>${r.pts.length>3?`<button class="xbtn" title="Удалить вершину" onclick="selV=${i};delV()">×</button>`:''}</td></tr>`).join('')}</table></details>`;
 }
 if(tab==='walls'){
  h+=`<p class="note" style="margin-top:0">Длина стены меняется сдвигом соседней стены — прямые углы сохраняются. Пустая высота = высота потолка (${String(r.h).replace('.',',')} м).</p>
  <table class="wt"><tr><th>№</th><th>Длина, м</th><th>Высота</th><th>Отделка</th></tr>${r.pts.map((q,i)=>{const L=Geom.segLen(q,r.pts[(i+1)%r.pts.length]),w=r.walls[i];
   return`<tr class="${selWall===i?'sel':''}" onclick="selWall=${i};drawCanvas()"><td><b>${i+1}</b></td><td><input type="number" step="0.05" min="0.05" value="${L.toFixed(2)}" onchange="setLen(${i},this.value)"></td><td><input type="number" step="0.05" placeholder="${r.h}" value="${w.h??''}" onchange="R().walls[${i}].h=this.value===''?null:+this.value;commit('Изменена высота стены')"></td><td><select onchange="R().walls[${i}].finish=this.value;commit('Изменена отделка стены')">${Object.entries(Plan.FIN_N).map(([k,t])=>`<option value="${k}" ${w.finish===k?'selected':''}>${t}</option>`).join('')}</select></td></tr>`}).join('')}</table>
  <div class="fld mt2">Все стены сразу</div><div class="seg mt">${Object.entries(Plan.FIN_N).map(([k,t])=>`<button onclick="R().walls.forEach(w=>w.finish='${k}');commit('Изменена отделка стен')">${t}</button>`).join('')}</div>`;
 }
 if(tab==='open'){
  const wopt=sel=>r.pts.map((q,i)=>`<option value="${r.walls[i].id}" ${r.walls[i].id===sel?'selected':''}>Стена ${i+1} · ${Plan.f2(Geom.segLen(q,r.pts[(i+1)%r.pts.length]))} м</option>`).join('');
  h+=`<h3 style="font-size:15px">Двери и окна</h3>${r.openings.map(o=>`<div class="card" style="padding:12px;margin-bottom:8px"><div style="display:flex;justify-content:space-between;align-items:center"><b>${o.kind==='door'?'🚪 Дверь':'🪟 Окно'}</b><button class="xbtn" onclick="R().openings=R().openings.filter(x=>x.id!=='${o.id}');commit('Удалён проём')">×</button></div>
   <div class="f2 mt"><label class="fld" style="grid-column:1/-1">Стена<select onchange="setO('${o.id}','wallId',this.value)">${wopt(o.wallId)}</select></label>
   <label class="fld">Ширина, м<input type="number" step="0.05" value="${o.w}" onchange="setO('${o.id}','w',+this.value)"></label><label class="fld">Высота, м<input type="number" step="0.05" value="${o.h}" onchange="setO('${o.id}','h',+this.value)"></label>
   <label class="fld">От начала стены, м<input type="number" step="0.05" value="${o.off}" onchange="setO('${o.id}','off',+this.value)"></label>${o.kind==='window'?`<label class="fld">Подоконник, м<input type="number" step="0.05" value="${o.sill||0}" onchange="setO('${o.id}','sill',+this.value)"></label>`:''}</div></div>`).join('')||'<p class="note">Проёмов нет.</p>'}
   <div class="seg"><button onclick="addO('door')">＋ Дверь</button><button onclick="addO('window')">＋ Окно</button></div>
   <h3 style="font-size:15px;margin-top:20px">Вычитаемые области пола</h3><p class="note" style="margin-top:-6px">Ванна, короб, встроенный шкаф — их площадь не покрывают плиткой или ламинатом.</p>
   ${r.excl.map(x=>`<div class="card" style="padding:12px;margin-bottom:8px"><div style="display:flex;justify-content:space-between;align-items:center"><input value="${esc(x.name)}" style="border:0;font-weight:700;font:inherit;font-weight:700;padding:0" onchange="setX('${x.id}','name',this.value)"><button class="xbtn" onclick="R().excl=R().excl.filter(q=>q.id!=='${x.id}');commit('Удалена вычитаемая область')">×</button></div>
   <div class="f4 mt"><label class="fld">Ширина<input type="number" step="0.05" value="${x.w}" onchange="setX('${x.id}','w',+this.value)"></label><label class="fld">Глубина<input type="number" step="0.05" value="${x.h}" onchange="setX('${x.id}','h',+this.value)"></label><label class="fld">X<input type="number" step="0.05" value="${x.x}" onchange="setX('${x.id}','x',+this.value)"></label><label class="fld">Y<input type="number" step="0.05" value="${x.y}" onchange="setX('${x.id}','y',+this.value)"></label></div></div>`).join('')}
   <div class="seg"><button onclick="addX('Ванна',1.7,0.7)">＋ Ванна 170×70</button><button onclick="addX('Короб',0.3,0.3)">＋ Короб</button><button onclick="addX('Шкаф',1.2,0.6)">＋ Шкаф</button></div>`;
 }
 if(tab==='fin'){
  const sug=r.pts.length>4||r.shape.kind==='poly'?15:10;
  h+=`<label class="fld">Пол<select onchange="R().floor=this.value;commit('Изменена отделка пола')"><option value="tile" ${r.floor==='tile'?'selected':''}>Плитка / керамогранит</option><option value="laminate" ${r.floor==='laminate'?'selected':''}>Ламинат</option><option value="none" ${r.floor==='none'?'selected':''}>Без отделки</option></select></label>
  ${r.floor!=='none'?`<div class="surf"><span>Материал пола<b>${num(Geom.validate(r).ok?Geom.metrics(r).floorNet:0)} м²</b></span>${matPicker(p,r,r.floor==='tile'?'tileFloor':'laminate')}</div>`:''}
  <label class="fld mt">Потолок<select onchange="R().ceil=this.value;commit('Изменена отделка потолка')"><option value="paint" ${r.ceil==='paint'?'selected':''}>Покраска</option><option value="none" ${r.ceil==='none'?'selected':''}>Без отделки</option></select></label>
  ${r.ceil==='paint'?`<div class="surf"><span>Краска потолка</span>${matPicker(p,r,'paintCeil')}</div>`:''}
  ${r.walls.some(w=>w.finish==='tile')?`<div class="surf"><span>Плитка на стены</span>${matPicker(p,r,'tileWall')}</div>`:''}
  ${r.walls.some(w=>w.finish==='paint')?`<div class="surf"><span>Краска для стен</span>${matPicker(p,r,'paintWall')}</div>`:''}
  ${p.rooms.length>1&&roomRoles(r).length?`<button class="btn ghost sm mt" onclick="matAll()">Применить эти материалы ко всем помещениям</button>`:''}
  <label class="fld mt">Запас на подрезку плитки и ламината, %<input type="number" min="0" max="30" step="1" value="${r.waste}" onchange="R().waste=Math.max(0,Math.min(30,+this.value||0));commit('Изменён запас')"></label>
  ${r.waste<sug?`<p class="note">Для формы с ${r.pts.length} углами обычно берут запас ${sug}%: больше подрезки. <button class="btn ghost sm" onclick="R().waste=${sug};commit('Изменён запас')">Поставить ${sug}%</button></p>`:''}
  <label class="opts2 mt"><label><input type="checkbox" ${(r.wet??Calc.WET.includes(r.type))?'checked':''} onchange="R().wet=this.checked;commit('Изменена гидроизоляция')"><span><b>Влажное помещение</b><small>Добавит гидроизоляцию пола и 20 см стен, ленту в углы</small></span></label></label>
  <p class="note">Отделку отдельных стен задайте на вкладке «Стены»: например, плитка только за ванной, остальное — покраска.</p>`;
 }
 if(p.rooms.length>1)h+=`<button class="btn red sm mt2" onclick="delRoom()">Удалить помещение «${esc(r.name)}»</button>`;
 $('#panel').innerHTML=h;
}
function setType(t){const r=R(),d=RT[t];r.type=t;if(Object.values(RT).some(x=>x.name===r.name))r.name=d.name;r.floor=d.floor;r.ceil=d.ceil;r.walls.forEach(w=>w.finish=d.walls);delete r.wet;commit('Изменён тип помещения');toast(`Отделка по умолчанию для «${d.name}» применена`)}
// Шаблон строится от левого верхнего угла комнаты, чтобы она не прыгала по плану
const tplPts=(kind,params,o)=>Geom.fromTemplate(kind,params).map(([x,y])=>[Geom.r2(x+(o.ox||0)),Geom.r2(y+(o.oy||0))]);
// Материал поверхности помещения: меняет смету и рисунок пола на плане
function onMat(rid,role,pid){const r=p.rooms.find(x=>x.id===rid);setRoomMat(p,[r],role,pid||null);save();renderAll();toast(pid?`${esc(r.name)}: ${esc(P(pid).name)}`:`${esc(r.name)}: по комплектации`)}
function matAll(){const r=R();roomRoles(r).forEach(role=>{const pid=r.mat&&r.mat[role];const rs=p.rooms.filter(x=>roomRoles(x).includes(role));rs.forEach(x=>{x.mat=x.mat||{};if(pid)x.mat[role]=pid;else delete x.mat[role]})});recalc(p);touchEst(p,`Материалы «${r.name}» применены ко всем помещениям`);save();renderAll();toast('Материалы применены ко всем помещениям')}
function setH(val){const x=parseFloat(String(val).replace(',','.'));if(!(x>0)){toast('Введите высоту потолка в метрах, например 2,7',false);renderPanel();return}R().h=Geom.r2(x);commit('Изменена высота потолка')}
function setTpl(k){
 const r=R(),t=Geom.TEMPLATES[k],prev=r.shape;
 const params=prev.kind===k?prev.params:(prev.from===k&&prev.params)||Object.fromEntries(t.params.map(([q,,v])=>[q,v]));
 if(k==='rect'&&prev.kind!=='rect'){const xs=r.pts.map(q=>q[0]),ys=r.pts.map(q=>q[1]);params.L=Geom.r2(Math.max(...xs)-Math.min(...xs));params.W=Geom.r2(Math.max(...ys)-Math.min(...ys))}
 const ox=Math.min(...r.pts.map(q=>q[0])),oy=Math.min(...r.pts.map(q=>q[1]));r.shape={kind:k,params:{...params},ox,oy};r.pts=tplPts(k,r.shape.params,r.shape);
 // проёмы со стен, которых в новой форме нет, переносим на последнюю стену, а не теряем
 const keepOps=r.openings.map(o=>({o,i:r.walls.findIndex(w=>w.id===o.wallId)}));syncWalls(r);
 keepOps.forEach(({o,i})=>{if(!r.walls.some(w=>w.id===o.wallId)){const j=Math.min(i,r.walls.length-1),L=Geom.segLen(r.pts[j],r.pts[(j+1)%r.pts.length]);o.wallId=r.walls[j].id;o.off=Geom.r2(Math.max(0,Math.min(o.off,L-o.w)));r.openings.push(o)}});
 r.openings.forEach(o=>{const j=r.walls.findIndex(w=>w.id===o.wallId),L=Geom.segLen(r.pts[j],r.pts[(j+1)%r.pts.length]);if(o.off+o.w>L)o.off=Geom.r2(Math.max(0,L-o.w))});selV=null;commit('Выбрана форма: '+t.name);center();
}
function setParam(k,val){
 const r=R(),t=Geom.TEMPLATES[r.shape.kind],x=parseFloat(val);if(!(x>0))return;
 const np={...r.shape.params,[k]:x},err=t.check&&t.check(np);$('#tplErr').textContent=err||'';if(err)return;
 r.shape.params=np;r.pts=tplPts(r.shape.kind,np,r.shape);recalc(p);save();drawCanvas();drawResults();renderTabs();clearTimeout(setParam.t);setParam.t=setTimeout(()=>commit('Изменены размеры помещения',true),600);
}
function setLen(i,val){const r=R(),x=parseFloat(val);if(!(x>=0.05)){toast('Длина стены должна быть больше 5 см',false);renderPanel();return}r.pts=Geom.setWallLength(r.pts,i,x);toPoly(r);commit(`Стена ${i+1}: длина ${val} м`)}
function setXY(i,k,val){const r=R(),x=parseFloat(val);if(isNaN(x))return;r.pts[i][k]=Geom.r2(x);toPoly(r);commit('Изменены координаты вершины')}
function setO(id,k,val){const o=R().openings.find(x=>x.id===id);if(['w','h'].includes(k)&&!(val>0)||['off','sill'].includes(k)&&!(val>=0)||Number.isNaN(val)){toast('Размер проёма должен быть положительным числом',false);renderPanel();return}o[k]=typeof val==='number'?Geom.r2(val):val;commit('Изменён проём')}
function addO(kind){const r=R(),L=r.pts.map((q,i)=>Geom.segLen(q,r.pts[(i+1)%r.pts.length])),i=L.indexOf(Math.max(...L)),w=kind==='door'?0.8:Math.min(1.2,L[i]-0.4);
 r.openings.push({id:uid(),kind,wallId:r.walls[i].id,w:Geom.r2(w),h:kind==='door'?2:1.4,off:Geom.r2(Math.max(0,(L[i]-w)/2)),sill:kind==='door'?0:0.85});commit(kind==='door'?'Добавлена дверь':'Добавлено окно')}
function setX(id,k,val){const x=R().excl.find(q=>q.id===id);if(['w','h'].includes(k)&&!(val>0)||Number.isNaN(val)){toast('Размеры вычета должны быть положительными',false);renderPanel();return}x[k]=typeof val==='number'?Geom.r2(val):val;commit('Изменена вычитаемая область')}
function addX(name,w,h){const r=R(),xs=r.pts.map(q=>q[0]),ys=r.pts.map(q=>q[1]);r.excl.push({id:uid(),name,w,h,x:Geom.r2(Math.min(...xs)+0.05),y:Geom.r2(Math.min(...ys)+0.05)});commit('Добавлена вычитаемая область: '+name)}
function delRoom(){if(!confirm('Удалить помещение?'))return;p.rooms=p.rooms.filter(r=>r.id!==p.activeRoom);p.activeRoom=p.rooms[0].id;commit('Удалено помещение');center()}
let nr={type:'living',kind:'rect'};
function openAddRoom(){
 $('#nrType').innerHTML=Object.entries(RT).map(([k,t])=>`<button class="${nr.type===k?'on':''}" onclick="nr.type='${k}';openAddRoom()">${t.icon} ${t.name}</button>`).join('');
 $('#nrTpl').innerHTML=Object.entries(Geom.TEMPLATES).map(([k,t])=>`<button class="${nr.kind===k?'on':''}" onclick="nr.kind='${k}';openAddRoom()">${Plan.tplIcon(k)}${t.name}</button>`).join('');
 $('#mRoom').classList.add('show');
}
function addRoom(){const r=makeRoom(nr.type,nr.kind);if(p.rooms.some(q=>q.name===r.name)){let k=2;while(p.rooms.some(q=>q.name===r.name+' '+k))k++;r.name+=' '+k}const all=p.rooms.flatMap(q=>q.pts);if(all.length){const dx=Geom.r2(Math.max(...all.map(q=>q[0]))+1-Math.min(...r.pts.map(q=>q[0]))),dy=Geom.r2(Math.min(...all.map(q=>q[1]))-Math.min(...r.pts.map(q=>q[1])));r.pts=r.pts.map(([x,y])=>[Geom.r2(x+dx),Geom.r2(y+dy)]);r.shape={...r.shape,ox:dx,oy:dy}}p.rooms.push(r);p.activeRoom=r.id;$('#mRoom').classList.remove('show');commit('Добавлено помещение: '+r.name);center()}

// ---------- Результаты ----------
function drawResults(){
 const r=R(),val=Geom.validate(r),f=Plan.f2;
 let h='';
 if(!val.ok)h+=`<div class="errs"><b>Расчёт невозможен — исправьте геометрию:</b><ul>${val.errors.map(e=>`<li>${esc(e)}</li>`).join('')}</ul>Смета не будет пересчитана по ошибочному контуру.</div>`;
 else{const m=Geom.metrics(r);
  h+=`<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h3 style="margin:0">${esc(r.name)}: площади</h3><span class="note">Формула Гаусса по ${r.pts.length} вершинам</span></div>
  <div class="metrics mt" style="grid-template-columns:repeat(4,1fr)">
   <div><b>${f(m.floor)} м²</b><span>Пол${m.excl?` · без вычетов ${f(m.floorNet)} м²`:''}</span></div><div><b>${f(m.ceil)} м²</b><span>Потолок</span></div>
   <div><b>${f(m.perim)} м</b><span>Периметр</span></div><div><b>${f(m.wallNet)} м²</b><span>Стены за вычетом проёмов ${f(m.openings)} м²</span></div>
   <div><b>${f(m.byFinish.tile||0)} м²</b><span>Стены под плитку</span></div><div><b>${f(m.byFinish.paint||0)} м²</b><span>Стены под покраску</span></div>
   <div><b>${r.floor==='none'?'—':f(m.floorNet)+' м²'}</b><span>Пол: ${r.floor==='tile'?'плитка':r.floor==='laminate'?'ламинат':'без отделки'}</span></div><div><b>${r.waste}%</b><span>Запас на подрезку</span></div></div>`;
 }
 const others=p.rooms.filter(x=>x.id!==r.id);
 const pe=p.calc||{},tot=estTotal(p);
 h+=`<div style="display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)">
  <div><div class="note">Материалы по проекту${others.length?` (${p.rooms.length} помещения)`:''} · ${TIERS[p.tier]}</div><div style="font-size:26px;font-weight:800">${pe.ok?byn(tot):'—'}</div><div class="note">${pe.ok?`${p.est.lines.length} позиций · ${areaSummary(p)}`:'есть ошибки геометрии'}</div></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn g" href="masters.html?project=${p.id}">👷 Нужен мастер</a><a class="btn o ${pe.ok?'':'dis'}" ${pe.ok?`href="smeta.html?project=${p.id}${fromPid?'&focus='+fromPid:''}"`:'onclick="toast(\'Сначала исправьте геометрию\',false)"'}>Подобрать материалы → смета</a></div></div>
  <p class="note" style="margin-bottom:0">Проект сохраняется автоматически. Количества считает алгоритм по геометрии и нормам расхода товаров.</p>`;
 $('#res').innerHTML=h;
}
function renderAll(){renderTabs();renderPanel();drawCanvas();drawResults();chrome('planner')}
banner();renderTabs();renderPanel();center();drawResults();
if(qp('from')==='photo')fitAll();
</script></body></html>
