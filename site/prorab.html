<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ОМИК — AI-прораб</title><link rel="stylesheet" href="style.css?v=202610271941">
<style>
.chat{display:grid;grid-template-columns:300px 1fr;gap:20px;margin-top:20px}
.pane{padding:22px;height:fit-content}
.pane img{width:100%;border-radius:14px}
.pane h3{margin:12px 0 4px}
.feat{display:grid;gap:8px;margin-top:12px;font-size:13px}
.feat div::before{content:"✔ ";color:var(--blue);font-weight:800}
.box{display:flex;flex-direction:column;height:640px}
.hd{display:flex;gap:12px;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line)}
.hd img{width:44px;height:44px;border-radius:50%;object-fit:cover}
.hd small{color:var(--ok);font-weight:600}
.msgs{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px;background:#f8fafd}
.m{display:flex;gap:10px;max-width:82%;animation:in .3s}
.m img{width:36px;height:36px;border-radius:50%;object-fit:cover;flex:none}
.b{background:var(--blue-l);padding:12px 16px;border-radius:4px 16px 16px 16px;font-size:14px}
.m.u{align-self:flex-end}.m.u .b{background:var(--blue);color:#fff;border-radius:16px 4px 16px 16px}
.t{font-size:11px;color:var(--mute);margin-top:3px}
.opts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.opts button{border:2px solid var(--blue);background:#fff;color:var(--blue);border-radius:20px;padding:6px 14px;font:inherit;font-weight:600;font-size:13px;cursor:pointer}
.opts button:hover{background:var(--blue);color:#fff}
.dots{display:flex;gap:4px;padding:6px 2px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--blue);animation:b 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{50%{transform:translateY(-5px);opacity:.4}}@keyframes in{from{opacity:0;transform:translateY(8px)}}
.proj{background:#fff;border:2px solid var(--blue);border-radius:14px;padding:14px 16px;margin-top:10px;font-size:13px;min-width:280px}
.proj div{display:flex;justify-content:space-between;padding:3px 0}.proj div span:first-child{color:var(--mute)}
.inp{display:flex;gap:8px;padding:14px 20px;border-top:1px solid var(--line)}
.inp input{flex:1;border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit;outline:0}
@media(max-width:900px){.chat{grid-template-columns:1fr}.pane{display:none}}
</style></head><body><div id="chrome"></div>
<div class="wrap"><div class="crumbs"><a href="index.html">Главная</a> / ОМА Прораб</div>
<div class="steps"><span class="on">1 Задача</span><span>2 Планировка</span><span>3 Смета</span><span>4 Корзина</span><span>5 Исполнение</span></div>
<div class="chat">
 <div class="card pane"><img src="img/omik-hero.png" class="m" alt=""><h3>ОМИК</h3><div class="note">Маскот «ОМА Прораб»</div>
  <div class="feat"><div>Знает о строительстве и ремонте</div><div>Объясняет просто и понятно</div><div>Помогает принять правильное решение</div><div>Всегда на стороне клиента</div></div></div>
 <div class="card box"><div class="hd"><img src="img/omik-avatar.png" alt=""><div><b>ОМИК · AI-прораб</b><br><small>● онлайн</small></div></div>
  <div class="msgs" id="msgs"></div>
  <form class="inp" onsubmit="event.preventDefault();free()"><input id="in" placeholder="Напишите или загрузите фото комнаты…"><button class="btn">Отправить</button></form></div>
</div></div>
<script src="common.js"></script><script>chrome()
const $=document.getElementById('msgs');
const time=()=>{const d=new Date();return d.getHours()+':'+String(d.getMinutes()).padStart(2,'0')};
function bot(html,opts){return new Promise(r=>{const d=document.createElement('div');d.className='m';d.innerHTML='<img src="img/omik-avatar.png"><div><div class="b"><div class="dots"><i></i><i></i><i></i></div></div></div>';$.append(d);$.scrollTop=1e9;
 setTimeout(()=>{d.querySelector('.b').innerHTML=html+(opts?'<div class="opts">'+opts.map(o=>`<button>${o}</button>`).join('')+'</div>':'')+'<div class="t">'+time()+'</div>';
 d.querySelectorAll('.opts button').forEach(b=>b.onclick=()=>pick(b.textContent,d));$.scrollTop=1e9;r()},900)})}
function user(t){const d=document.createElement('div');d.className='m u';d.innerHTML='<div><div class="b"></div></div>';d.querySelector('.b').textContent=t;$.append(d);$.scrollTop=1e9}
let step=0,ans={};
const q=new URLSearchParams(location.search).get('q')||'Хочу поменять плитку в ванной 4 м²';
const flow=[
 ()=>bot('Привет! Я ОМИК — ваш AI-помощник по строительству и ремонту ОМА. Понял задачу: <b>замена плитки в ванной</b>. Уточню пару деталей.'),
 ()=>bot('Что меняем?',['Пол и стены','Только пол','Только стены']),
 ()=>bot('Какой бюджет на материалы?',['до 800 BYN','800–1500 BYN','от 1500 BYN']),
 ()=>bot('И последний вопрос: размеры уже знаете?',['Да, введу сами','Закажу замер']),
 ()=>bot('Готово! Я создал проект. <div class="proj"><div><span>Комната</span><b>Ванная</b></div><div><span>Площадь пола</span><b>4 м²</b></div><div><span>Работы</span><b id="pw"></b></div><div><span>Бюджет</span><b id="pb"></b></div></div>Количество материалов посчитаю по формулам, а не «придумаю» — так смете можно доверять.',['Перейти к планировке →'])
];
function pick(t,d){d.querySelectorAll('.opts button').forEach(b=>b.disabled=true);d.querySelector('.opts').style.opacity=.5;user(t);ans[step]=t;
 if(step===4){location='smeta.html';return}
 next()}
async function next(){step++;await flow[step]();if(step===4){document.getElementById('pw').textContent=ans[1]||'Пол и стены';document.getElementById('pb').textContent=ans[2]||'800–1500 BYN'}}
(async()=>{user(q);await flow[0]();await next()})();
function free(){const i=document.getElementById('in');if(!i.value)return;user(i.value);i.value='';bot('Принял! В демо я веду вас по сценарию «ванная 4 м²» — выберите вариант выше 👆')}
</script></body></html>
